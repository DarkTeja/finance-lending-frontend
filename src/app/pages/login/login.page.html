<ion-content [fullscreen]="true" class="login-bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="login-container">
    <div class="login-card glass-panel">
      <div class="logo-section">
        <div class="glow-logo">
          <ion-icon name="wallet-outline"></ion-icon>
        </div>
        <h1>LendFlow</h1>
        <p>Enterprise Money Lending Engine</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <div class="input-group">
          <label>Username</label>
          <div class="input-wrapper">
            <ion-icon name="person-outline"></ion-icon>
            <input type="text" formControlName="username" placeholder="Enter username..." />
          </div>
        </div>

        <div class="input-group">
          <label>Password</label>
          <div class="input-wrapper">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input type="password" formControlName="password" placeholder="Enter password..." />
          </div>
        </div>

        <button type="submit" [disabled]="loginForm.invalid" class="login-btn">
          Sign In
        </button>
      </form>
    </div>
  </div>
</ion-content>
