<ion-content [fullscreen]="true" class="login-bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="login-container">
    <div class="login-card glass-panel">
      <div class="logo-section">
        <div class="glow-logo">
          <ion-icon name="key-outline"></ion-icon>
        </div>
        <h1>Reset Password</h1>
        <p>Set a new password for your account</p>
      </div>

      <div class="validation-message" style="text-align: center; margin-bottom: 20px;">
        <p style="color: #64748b; font-size: 14px;">An OTP was sent to <strong>{{ email }}</strong></p>
      </div>

      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="login-form">
        <div class="input-group">
          <label>6-Digit OTP *</label>
          <div class="input-wrapper">
            <ion-icon name="keypad-outline"></ion-icon>
            <input type="text" formControlName="otp" placeholder="Enter OTP..." maxlength="6" />
          </div>
        </div>

        <div class="input-group">
          <label>New Password *</label>
          <div class="input-wrapper">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input type="password" formControlName="password" placeholder="Min. 6 characters..." />
          </div>
        </div>

        <div class="input-group">
          <label>Confirm Password *</label>
          <div class="input-wrapper">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input type="password" formControlName="confirmPassword" placeholder="Confirm new password..." />
          </div>
          <div *ngIf="resetForm.errors?.['mismatch'] && resetForm.get('confirmPassword')?.touched" style="color: #ef4444; font-size: 12px; margin-top: 5px;">
            Passwords do not match.
          </div>
        </div>

        <button type="submit" [disabled]="resetForm.invalid" class="login-btn">
          Reset Password
        </button>
      </form>
    </div>
  </div>
</ion-content>
