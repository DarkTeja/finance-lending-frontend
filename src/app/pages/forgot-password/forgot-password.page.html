<ion-content [fullscreen]="true" class="login-bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="login-container">
    <div class="login-card glass-panel">
      <div class="logo-section">
        <div class="glow-logo">
          <ion-icon name="mail-outline"></ion-icon>
        </div>
        <h1>Forgot Password</h1>
        <p>Enter your email to receive a reset link</p>
      </div>

      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onForgotPassword()" class="login-form">
        <div class="input-group">
          <label>Email Address</label>
          <div class="input-wrapper">
            <ion-icon name="mail-outline"></ion-icon>
            <input type="email" formControlName="email" placeholder="Enter your email..." />
          </div>
        </div>

        <button type="submit" [disabled]="forgotPasswordForm.invalid" class="login-btn">
          Send Reset Link
        </button>
        
        <div class="forgot-password-link" style="text-align: center; margin-top: 15px;">
          <a routerLink="/login" style="color: #64748b; cursor: pointer; text-decoration: underline;">Back to Login</a>
        </div>
      </form>
    </div>
  </div>
</ion-content>
